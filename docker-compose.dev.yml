services:
  api:
    container_name: forum-api
    # Distinct from docker-compose.yml (forum-api:prod) so `forum up` cannot
    # overwrite this image with USER nestjs — that caused EACCES on bun install.
    image: forum-api:dev
    user: "0:0"
    env_file:
      - .env
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    # Named volume can go stale when package.json gains deps; reinstall on start.
    command: sh -c "bun install && bun run start:dev"
    networks:
      - forum.test

volumes:
  api_node_modules:

networks:
  forum.test:
    name: forum.test
    external: true

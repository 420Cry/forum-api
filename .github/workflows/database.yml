# Database CI
# - pull_request: verify Session pooler auth + dry-run (no schema apply)
# - push to main / workflow_dispatch: apply TypeORM migrate+seed and supabase db push
name: Deploy database

on:
  pull_request:
    paths:
      - 'src/database/**'
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main, master]
    paths:
      - 'src/database/**'
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

concurrency:
  group: >-
    database-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || 'prod'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typeorm:
    name: >-
      TypeORM ${{
        github.event_name == 'pull_request' && 'check' || 'migrate + seed'
      }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      PGSSLMODE: no-verify
      APPLY: ${{ github.event_name != 'pull_request' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Session pooler requires postgres.<project-ref> — never bare "postgres".
      # Set at job level so TypeORM cannot fall back to dataSource default.
      DB_USERNAME: postgres.${{ secrets.SUPABASE_PROJECT_ID }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DB_PASSWORD }}
      DB_NAME: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              missing=1
            fi
          done
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::Set SUPABASE_DB_PASSWORD or DB_PASSWORD."
            missing=1
          fi
          if [ "$DB_USERNAME" = "postgres." ] || [ "$DB_USERNAME" = "postgres" ]; then
            echo "::error::DB_USERNAME must be postgres.<project-ref>, got '$DB_USERNAME'"
            missing=1
          fi
          exit "$missing"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Writes supabase/.temp/pooler-url (IPv4 Session pooler). Do not --skip-pooler.
      - name: Link Supabase project
        run: >
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$DB_PASSWORD"
          --yes

      - name: Resolve DB_HOST / DB_PORT from pooler URL
        run: |
          if [ ! -f supabase/.temp/pooler-url ]; then
            echo "::error::supabase link did not write supabase/.temp/pooler-url"
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os

          raw = Path("supabase/.temp/pooler-url").read_text().strip()
          # Strip userinfo so passwords with '@' cannot break host parsing.
          scheme, _, rest = raw.partition("://")
          if "@" in rest:
              rest = rest.rsplit("@", 1)[-1]
              raw_no_user = f"{scheme}://{rest}"
          else:
              raw_no_user = raw

          u = urlparse(raw_no_user)
          if not u.hostname:
              raise SystemExit(f"Could not parse pooler URL host: {raw!r}")

          host = u.hostname
          port = u.port or 5432
          if "pooler.supabase" not in host:
              raise SystemExit(
                  f"Expected Session pooler host (*pooler.supabase*), got {host!r}"
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DB_HOST={host}\n")
              f.write(f"DB_PORT={port}\n")

          print("Resolved Session pooler:")
          print(f"  DB_HOST={host}")
          print(f"  DB_PORT={port}")
          print(f"  DB_USERNAME={os.environ.get('DB_USERNAME')}")
          print(f"  DB_NAME={os.environ.get('DB_NAME')}")
          PY

      - name: Sanity-check DB_* (no secrets)
        run: |
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DB_USERNAME=$DB_USERNAME"
          echo "DB_NAME=$DB_NAME"
          echo "PGSSLMODE=${PGSSLMODE:-}"
          echo "APPLY=${APPLY:-}"
          case "$DB_USERNAME" in
            postgres.*) ;;
            *)
              echo "::error::DB_USERNAME must be postgres.<project-ref>, got '$DB_USERNAME'"
              exit 1
              ;;
          esac
          if [ -z "${DB_HOST:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::DB_HOST or DB_PASSWORD is empty"
            exit 1
          fi

      - name: Probe env seen by Bun/TypeORM
        run: |
          bun -e '
            const u = process.env.DB_USERNAME
            const h = process.env.DB_HOST
            const p = process.env.DB_PORT
            console.log("[probe]", { host: h, port: p, username: u, hasPassword: Boolean(process.env.DB_PASSWORD) })
            if (!u || u === "postgres" || !u.startsWith("postgres.")) {
              console.error("DB_USERNAME must be postgres.<project-ref>")
              process.exit(1)
            }
          '

      # Connects to the DB — catches 28P01 / SSL / wrong host before apply.
      - name: Show TypeORM migrations (connection check)
        run: bun run migration:show

      - name: Run TypeORM migrations
        if: env.APPLY == 'true'
        run: bun run migration:run

      - name: Seed catalog tags
        if: env.APPLY == 'true'
        run: bun run seed

      - name: PR mode — skip apply
        if: env.APPLY != 'true'
        run: |
          echo "PR check only: connection + migration:show succeeded."
          echo "Migrate + seed run on merge to main (or workflow_dispatch)."

  supabase:
    name: >-
      Supabase CLI ${{
        github.event_name == 'pull_request' && 'check' || 'migrations'
      }}
    runs-on: ubuntu-latest
    needs: typeorm
    env:
      APPLY: ${{ github.event_name != 'pull_request' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              missing=1
            fi
          done
          exit "$missing"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: >
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Dry-run Supabase migrations
        if: env.APPLY != 'true'
        run: >
          supabase db push
          --dry-run
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Push Supabase migrations
        if: env.APPLY == 'true'
        run: >
          supabase db push
          --password "$SUPABASE_DB_PASSWORD"
          --yes

# Apply database changes on merge to main (replaces Heroku release migrations).
# 1) TypeORM — app tables via Session pooler (IPv4; auto-resolved by supabase link)
# 2) Supabase CLI — Storage buckets / Storage RLS under supabase/migrations/
name: Deploy database

on:
  push:
    branches: [main, master]
    paths:
      - 'src/database/**'
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

concurrency:
  group: database-prod
  cancel-in-progress: false

jobs:
  typeorm:
    name: TypeORM migrate + seed
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      PGSSLMODE: no-verify
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              missing=1
            fi
          done
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ] && [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::Set SUPABASE_DB_PASSWORD or DB_PASSWORD."
            missing=1
          fi
          exit "$missing"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Writes supabase/.temp/pooler-url (IPv4 Session pooler). Do not --skip-pooler.
      - name: Link Supabase project
        run: >
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "${SUPABASE_DB_PASSWORD:-$DB_PASSWORD}"
          --yes

      - name: Resolve DB_* from pooler URL
        run: |
          if [ ! -f supabase/.temp/pooler-url ]; then
            echo "::error::supabase link did not write supabase/.temp/pooler-url"
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os

          raw = Path("supabase/.temp/pooler-url").read_text().strip()
          u = urlparse(raw)
          if not u.hostname or not u.username:
              raise SystemExit(f"Could not parse pooler URL: {raw!r}")

          db_name = (u.path or "/postgres").lstrip("/") or "postgres"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DB_HOST={u.hostname}\n")
              f.write(f"DB_PORT={u.port or 5432}\n")
              f.write(f"DB_USERNAME={u.username}\n")
              f.write(f"DB_NAME={db_name}\n")

          print("Resolved Session pooler:")
          print(f"  DB_HOST={u.hostname}")
          print(f"  DB_PORT={u.port or 5432}")
          print(f"  DB_USERNAME={u.username}")
          print(f"  DB_NAME={db_name}")
          PY
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "DB_PASSWORD=${SUPABASE_DB_PASSWORD}" >> "$GITHUB_ENV"
          fi

      - name: Run TypeORM migrations
        run: bun run migration:run

      - name: Seed catalog tags
        run: bun run seed

  supabase:
    name: Supabase CLI migrations
    runs-on: ubuntu-latest
    needs: typeorm
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              missing=1
            fi
          done
          exit "$missing"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: >
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Push Supabase migrations
        run: >
          supabase db push
          --password "$SUPABASE_DB_PASSWORD"
          --yes

# Apply supabase/migrations (Storage buckets, RLS policies, etc.) to the
# linked hosted project. Separate from Heroku's TypeORM release phase.
name: Supabase migrations

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Pass -p explicitly (env alone can still prompt/hang). Prefer direct
      # connection — pooler has been flaky with password auth in CI.
      - name: Link project
        run: >
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
          --skip-pooler
          --yes

      - name: Push migrations
        run: >
          supabase db push
          --password "$SUPABASE_DB_PASSWORD"
          --yes
